name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the tag and version properties
        run: |
          version=$(sed -n 's/^seldomVersionName=//p' gradle.properties)
          code=$(sed -n 's/^seldomVersionCode=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          if [ "$version" != "0.$code.0" ]; then
            echo "versionName $version does not match versionCode $code" >&2
            exit 1
          fi

      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SELDOM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SELDOM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SELDOM_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "signing secrets are missing" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "the keystore has no key under the configured alias" >&2
            exit 1
          fi
          echo "SELDOM_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SELDOM_KEYSTORE_PASSWORD: ${{ secrets.SELDOM_KEYSTORE_PASSWORD }}
          SELDOM_KEY_ALIAS: ${{ secrets.SELDOM_KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Verify the signer
        run: |
          expected=$(tr -d ':[:space:]' < release/signer-sha256.txt | tr 'A-F' 'a-f')
          if ! printf '%s' "$expected" | grep -Eqx '[0-9a-f]{64}'; then
            echo "release/signer-sha256.txt is not a 64-digit hex SHA-256" >&2
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          apk=app/build/outputs/apk/release/app-release.apk
          output=$("$apksigner" verify --verbose --print-certs "$apk")
          digests=$(printf '%s\n' "$output" \
            | sed -n 's/^.*certificate SHA-256 digest: *//p' \
            | tr -d '[:space:]' | tr 'A-F' 'a-f' | sort -u)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one signer digest, got: $digests" >&2
            exit 1
          fi
          if ! printf '%s' "$digests" | grep -Eqx '[0-9a-f]{64}'; then
            echo "could not parse the signer digest" >&2
            exit 1
          fi
          if [ "$digests" != "$expected" ]; then
            echo "signer $digests does not match the pinned digest" >&2
            exit 1
          fi

      - name: Publish draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="seldom-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --draft --prerelease --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Seldom $GITHUB_REF_NAME"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
